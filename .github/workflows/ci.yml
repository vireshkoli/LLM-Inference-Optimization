name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail fast rather than silently proceeding on a partial environment.
  UV_FROZEN: "1"

jobs:
  check:
    name: lint · types · tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: Types (mypy --strict)
        run: uv run mypy

      # There is no GPU in CI, so this covers what does not need one: the
      # arrival-process maths, percentile computation, dispatch-lag validity
      # guard, cost model, results schema, and plot generation against
      # synthetic fixtures. Statistical code with no tests is a liability in a
      # benchmark repo specifically.
      - name: Tests
        run: uv run pytest -m "not gpu" --durations=10

  config-validation:
    name: sweep configs parse and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv sync --dev
      # A config that only fails at GPU-launch time costs a lab session.
      # Catch it here instead -- with the same pydantic models the runner uses,
      # not just a YAML parse, which accepts any typo.
      - name: Validate every sweep matrix, engine profile and the cost file
        run: |
          for f in configs/*.yaml; do
            [ "$f" = configs/cost.yaml ] && continue
            uv run llmbench validate --config "$f"
          done
          uv run python - <<'PY'
          from llmbench.config import load_cost_config, load_engine_profile
          from llmbench.schema import EngineName
          for engine in EngineName:
              print(f"ok   {load_engine_profile(engine).name} profile")
          load_cost_config("configs/cost.yaml")
          print("ok   configs/cost.yaml")
          PY
