[project]
name = "llmbench"
version = "0.1.0"
description = "Rigorous latency, throughput, quality and cost benchmarking of quantized LLM serving on NVIDIA A40"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Viresh Koli", email = "vireshkoli00@gmail.com" }]
keywords = ["llm", "inference", "benchmark", "vllm", "sglang", "quantization"]

dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "matplotlib>=3.9",
    "tokenizers>=0.20",
    "huggingface-hub>=0.25",
    "pyarrow>=25.0.1",
]

[project.optional-dependencies]
# uvloop is a measurement-path optimisation; excluded from CI (no benefit, extra build).
fast = ["uvloop>=0.20"]

[project.scripts]
llmbench = "llmbench.cli:app"

[project.urls]
Homepage = "https://github.com/vireshkoli/LLM-Inference-Optimization"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "scipy>=1.14",          # KS-test for arrival-process validation
    "types-pyyaml>=6.0",
    "scipy-stubs>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmbench"]

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "PT",        # pytest style
    "SIM",       # simplify
    "ARG",       # unused arguments
    "PL",        # pylint
    "RUF",
]
ignore = [
    "PLR0913",   # many arguments: benchmark records legitimately carry many fields
    "PLR0917",   # ditto, positional
    "PLR2004",   # magic values are fine in tests and unit conversions
]

[tool.ruff.lint.per-file-ignores]
# Fixtures compose from other fixtures, so argument counts are inherently high.
"tests/*" = ["PLR2004", "ARG001", "PLR0913", "PLR0917"]
# Contains engine output captured verbatim from a real run. Reflowing the lines
# would make the fixture stop matching what the engine actually prints, which is
# the entire reason it is in the repository.
"tests/test_engine_adapters.py" = ["E501", "PLR2004", "ARG001", "PLR0913", "PLR0917"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# pyarrow ships no py.typed marker; it is used only for offline dataset prep,
# never on the measurement hot path.
module = ["scipy.*", "matplotlib.*", "pyarrow.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "gpu: requires a GPU and a running engine (never runs in CI)",
]
