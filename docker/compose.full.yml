# Full measurement stack: engine + Prometheus + Grafana + DCGM exporter.
#
# The observability services here are the ones the dashboards and screenshots in
# docs/images came from. The engine services are a convenience for running an
# engine by hand: the sweep runner does not use them -- it launches each engine
# with `docker run` against a digest-pinned image (llmbench.engines.base), which
# is what every result records. Engines are declared behind profiles so the
# observability stack can run on its own.
#
#   Observability only:  docker compose -f docker/compose.full.yml up -d
#   With an engine:      docker compose -f docker/compose.full.yml --profile vllm up -d
#
# Host-specific values (HF cache path, GPU index, image tags, ports) are
# environment variables with defaults, written where they are used below.
#
# Every published port is bound to 127.0.0.1: Grafana runs with anonymous admin
# access and the engines' OpenAI API has no authentication, so none of them may
# listen on the network of a shared machine. Services reach each other over the
# compose network, which is unaffected.

x-gpu-device: &gpu-device
  # Selects a specific *host* GPU. Note it is renumbered to index 0 inside the
  # container, so never compare indices across the boundary — the engine adapter
  # asserts identity by UUID instead.
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["${BENCH_GPU:-1}"]
            capabilities: [gpu]

services:
  # ---------------------------------------------------------------------------
  # Engines, pinned by tag for convenience. Measurements do not come from these:
  # the runner pins the image digest itself and records it in each result.
  # ---------------------------------------------------------------------------
  vllm:
    profiles: ["vllm"]
    image: vllm/vllm-openai:${VLLM_TAG:-v0.26.0}
    container_name: llmbench-vllm
    <<: *gpu-device
    ports:
      - "127.0.0.1:${ENGINE_PORT:-8000}:8000"
      # The Docker bridge gateway, which is what host.docker.internal resolves
      # to, so Prometheus can scrape the engine without it facing the network.
      - "${BRIDGE_GATEWAY:-172.17.0.1}:${ENGINE_PORT:-8000}:8000"
    volumes:
      # Read-only: the benchmark must never mutate the weights it measures.
      - ${HF_CACHE_DIR:-/home/ubuntu/.cache/huggingface}:/root/.cache/huggingface:ro
    environment:
      - HF_HOME=/root/.cache/huggingface
      - VLLM_LOGGING_LEVEL=INFO
    # vLLM's workers need far more than Docker's default 64 MB of /dev/shm.
    shm_size: "16gb"
    ipc: host
    # Model is POSITIONAL as of v0.26 (`--model` is deprecated), and
    # `--disable-log-requests` was REMOVED in favour of the inverted
    # `--no-enable-log-requests`. Both mistakes exit the container immediately.
    command:
      - ${MODEL_ID:-meta-llama/Llama-3.1-8B-Instruct}
      - --max-model-len=${MAX_MODEL_LEN:-4096}
      - --gpu-memory-utilization=${GPU_MEM_UTIL:-0.90}
      - --max-num-seqs=${MAX_NUM_SEQS:-256}
      - --no-enable-log-requests
      - --seed=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      # Generous: cold weight load plus CUDA graph capture takes minutes.
      retries: 90
      start_period: 60s

  sglang:
    profiles: ["sglang"]
    # cu129, NOT cu130 — CUDA 13 requires driver >= 580 and this host runs 570.
    image: lmsysorg/sglang:${SGLANG_TAG:-v0.5.17-cu129}
    container_name: llmbench-sglang
    <<: *gpu-device
    ports:
      - "127.0.0.1:${ENGINE_PORT:-8000}:8000"
      # The Docker bridge gateway, which is what host.docker.internal resolves
      # to, so Prometheus can scrape the engine without it facing the network.
      - "${BRIDGE_GATEWAY:-172.17.0.1}:${ENGINE_PORT:-8000}:8000"
    volumes:
      - ${HF_CACHE_DIR:-/home/ubuntu/.cache/huggingface}:/root/.cache/huggingface:ro
    environment:
      - HF_HOME=/root/.cache/huggingface
    shm_size: "16gb"
    ipc: host
    entrypoint: ["python3", "-m", "sglang.launch_server"]
    command:
      - --model-path=${MODEL_ID:-meta-llama/Llama-3.1-8B-Instruct}
      - --host=0.0.0.0
      - --port=8000
      - --context-length=${MAX_MODEL_LEN:-4096}
      - --mem-fraction-static=${GPU_MEM_UTIL:-0.90}
      - --max-running-requests=${MAX_NUM_SEQS:-256}
      # Metrics are opt-in on SGLang, unlike vLLM.
      - --enable-metrics
      - --random-seed=0

  # ---------------------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: llmbench-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # A 1s scrape would perturb the thing being measured; 5s resolves a
      # multi-minute run's behaviour without meaningful overhead.
      - --storage.tsdb.retention.time=30d
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: llmbench-grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      # Local-only dashboards for screenshots: the port is bound to loopback
      # above, which is what makes anonymous admin acceptable here.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      # Theme is passed per-render instead of set as a default: setting it
      # here makes the anonymous user attempt a preference write on every
      # page load, which fails and puts an error toast in the screenshot.
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      # The benchmark host is headless, so dashboard screenshots are rendered
      # server-side rather than captured from a browser.
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_LOG_FILTERS=rendering:debug
    depends_on:
      - prometheus

  renderer:
    image: grafana/grafana-image-renderer:3.12.6
    container_name: llmbench-renderer
    environment:
      - ENABLE_METRICS=false
      # Wide enough that a 12-column panel is legible in a README.
      - RENDERING_VIEWPORT_WIDTH=1600
      - RENDERING_VIEWPORT_HEIGHT=900

  dcgm-exporter:
    # Supplies GPU utilisation, memory, temperature and clocks to Prometheus.
    # The in-process nvidia-smi sampler remains the source of truth for values
    # stored in results; this feeds the dashboards.
    image: nvidia/dcgm-exporter:4.5.2-4.8.1-ubuntu22.04
    container_name: llmbench-dcgm
    ports:
      - "127.0.0.1:9400:9400"
    cap_add:
      - SYS_ADMIN
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # All GPUs on purpose: the neighbouring card's thermal behaviour
              # is a documented confound for this chassis, so it is worth
              # seeing on the dashboard rather than hiding.
              count: all
              capabilities: [gpu]

volumes:
  prometheus-data:
  grafana-data:
